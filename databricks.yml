bundle:
  name: sovereignshield_bundle

# The bundle owns the DATA AND POLICY PLANE: table DDL, the policy UDFs, and the
# row filter / column mask bindings. Terraform owns the infrastructure and
# access-control plane (identity, workspace, catalog, schema, grants, warehouse).
# One writer per object - see docs/ENTERPRISE_ONBOARDING_PLAYBOOK.md.

variables:
  warehouse_id:
    description: >-
      Serverless SQL warehouse the dissemination gateway queries through.
      Emitted by `terraform output -raw sql_warehouse_id`. Every statement it
      runs is subject to the Unity Catalog row filter and column mask, so the
      warehouse grants no entitlement of its own.
    default: ""

  catalog:
    description: Unity Catalog catalog. Must match unity_catalog_triple_lock.sql.
    default: dbw_sovereignshield

  schema:
    description: Schema holding the governed tables.
    default: sovereign_shield

targets:
  dev:
    mode: development
    default: true
    workspace:
      # host is intentionally omitted here; 
      # DABs automatically picks up $env:DATABRICKS_HOST from pre_auth.ps1
    
    resources:
      apps:
        sovereignshield_portal:
          name: "sovereignshield-portal"
          description: "Public SDMx 3.0 data portal and REST gateway for BIS Locational Banking Statistics."
          # ./src carries app.yaml, its own requirements.txt and the portal
          # modules. The runtime reads the command and environment from app.yaml.
          source_code_path: ./src
          resources:
            - name: "sql-warehouse"
              description: "Query engine for the governed Delta history."
              sql_warehouse:
                id: ${var.warehouse_id}
                permission: "CAN_USE"

      jobs:
        sovereignshield_sdmx_pipeline:
          name: "[DEV] SovereignShield SDMx Ingestion & Validation"
          tasks:
            # Step 1: Provision / Refresh Triple-Lock Infrastructure.
            # Runs FIRST on every execution so no table ever exists unprotected.
            # The DDL is idempotent and non-destructive: dropping the history
            # table here would erase the entire SCD2 lineage on each run.
            - task_key: setup_triple_lock_schema
              job_cluster_key: sovereign_cluster
              spark_python_task:
                python_file: "src/apply_security.py"

            # Step 2: Generate and Append Synthetic Micro-Data
            - task_key: generate_synthetic_data
              depends_on:
                - task_key: setup_triple_lock_schema
              job_cluster_key: sovereign_cluster
              spark_python_task:
                python_file: "src/generate_sovereign_submissions.py"
              libraries:
                - requirements: requirements.txt

            # Step 3: Run Micro-to-Macro Ingestion & SCD2 Merge
            - task_key: run_scd2_merge
              depends_on:
                - task_key: generate_synthetic_data
              job_cluster_key: sovereign_cluster
              spark_python_task:
                python_file: "src/scd2_merge_engine.py"
              libraries:
                - requirements: requirements.txt

          job_clusters:
            - job_cluster_key: sovereign_cluster
              new_cluster:
                spark_version: "18.x-scala2.13"
                node_type_id: "Standard_DS3_v2"
                num_workers: 0 # STRICTLY NO WORKERS
                data_security_mode: USER_ISOLATION
                custom_tags:
                  ResourceClass: SingleNode
                spark_conf:
                  spark.databricks.cluster.profile: singleNode
                  spark.master: local[*, 4]
                azure_attributes:
                  availability: SPOT_WITH_FALLBACK_AZURE # Enforces massive spot discount