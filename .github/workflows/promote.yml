# Production-isolated promotion.
#
# The contractor opens a pull request; they cannot deploy it. Authentication to
# Azure uses OpenID Connect workload identity federation, so there is no client
# secret in repository settings to leak, rotate or forget.
#
# Job/credential pairing is deliberate and must stay in step with the federated
# credentials in terraform/modules/identity/main.tf. A job can only authenticate
# if a credential exists for its exact OIDC subject:
#
#   pull_request  -> no cloud federation or credentials
#   reviewed manual run -> repo:<owner>/<repo>:environment:production
#
# A job requesting an environment with no matching credential fails at the token
# exchange with an opaque 400, so adding one here means adding one there.

# ACTION PINNING
#
# Every action is pinned to an immutable commit SHA, not a tag. A tag is a
# movable pointer: whoever controls the action repository can repoint v3 at new
# code, and `@main` re-resolves on every run. Either would let an upstream
# compromise reach a job that holds a token capable of applying infrastructure.
#
# The trailing comment records which release each SHA is, so a bump is a
# deliberate, reviewable diff. Verify before changing one:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha

name: promote

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Reviewed cloud operation (verify does not authenticate to Azure)
        type: choice
        options: [verify, plan, deploy]
        default: verify

# Least privilege at the top; id-token is granted per job, only where a token is
# actually exchanged. The offline job must never be able to request one.
permissions:
  contents: read

concurrency:
  group: promote-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

jobs:
  # Distinguishes "this repository has not been wired up yet" from "it has been
  # wired up incorrectly". Those need opposite responses, and azure/login cannot
  # tell them apart - it reports only "Not all values are present", naming
  # neither the variable nor how to set it.
  #
  #   nothing set  -> deployment jobs skip cleanly; a fork or a fresh clone is
  #                   not broken, it is simply not connected to a subscription
  #   some set     -> fail loudly and name the gap; a half-configured deployment
  #                   is a misconfiguration, not an absence
  preflight:
    name: Configuration preflight
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'verify' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Require an active human approval gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/environments/production" > "$RUNNER_TEMP/environment.json"
          jq -e '.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0) and .prevent_self_review == true)' "$RUNNER_TEMP/environment.json"
          jq -e '.deployment_branch_policy.protected_branches == true' "$RUNNER_TEMP/environment.json"
      - name: Check deployment variables
        id: check
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
        run: |
          required=(AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
                    DATABRICKS_HOST TF_STATE_RESOURCE_GROUP TF_STATE_STORAGE_ACCOUNT TF_STATE_CONTAINER)
          missing=()
          for name in "${required[@]}"; do
            [ -z "${!name}" ] && missing+=("$name")
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "### Deployment configured" >> "$GITHUB_STEP_SUMMARY"
            echo "All ${#required[@]} repository variables are present." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ ${#missing[@]} -eq ${#required[@]} ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deployment skipped - repository not connected to a subscription"
              echo
              echo "Offline verification ran and is the meaningful gate here."
              echo "To enable deployment, run:"
              echo
              echo '```powershell'
              echo './sh/github_environment_setup.ps1 -Repository ${{ github.repository }} \'
              echo '    -Reviewers <github-username> \'
              echo '    -AzureClientId <app-id> -AzureTenantId <tenant> -AzureSubscriptionId <sub> \'
              echo '    -DatabricksHost <workspace-host> \'
              echo '    -TfStateResourceGroup <rg> -TfStateStorageAccount <account>'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Deployment misconfigured"
            echo
            echo "Some variables are set and others are not, so this is a gap rather"
            echo "than an absence. Missing:"
            echo
            for name in "${missing[@]}"; do echo "- \`$name\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Partially configured. Missing: ${missing[*]}"
          exit 1

  # Runs with NO cloud credentials. This is the gate a contractor reproduces on
  # a laptop, and the reason the test suite is offline by default.
  #
  # Nothing requiring authentication belongs here. `databricks bundle validate`
  # resolves the workspace and so needs a host and a token; it runs in `bundle`.
  verify:
    name: Offline verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Persona matrix, SDMx rules, contractor isolation, secret scan
        run: pytest tests/ -v

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Terraform format
        working-directory: terraform
        run: terraform fmt -recursive -check

      # -backend=false resolves providers and type-checks the configuration
      # without contacting the state backend, so this stays credential-free.
      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

  # This is a privileged plan of reviewed main, not a read-only PR identity.
  plan:
    name: Terraform plan
    needs: [verify, preflight]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'plan' &&
      github.ref == 'refs/heads/main' &&
      needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Reviewed non-destructive steady-state plan
        run: python sh/ci_terraform.py plan

  # Pushes to main only. Environment protection rules are the human gate, and
  # the federated credential is scoped to this environment name - a workflow
  # that skips it cannot authenticate at all.
  apply:
    name: Terraform apply
    needs: [verify, preflight]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'deploy' &&
      github.ref == 'refs/heads/main' &&
      needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
    permissions:
      contents: read
      id-token: write
    outputs:
      warehouse_id: ${{ steps.tf.outputs.warehouse_id }}
      run_as: ${{ steps.tf.outputs.run_as }}
      cluster: ${{ steps.tf.outputs.cluster }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Apply reviewed non-destructive steady-state plan
        id: tf
        run: python sh/ci_terraform.py apply

  bundle:
    name: Deploy data and policy plane
    needs: apply
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: azure-cli
      BUNDLE_VAR_warehouse_id: ${{ needs.apply.outputs.warehouse_id }}
      BUNDLE_VAR_run_as_service_principal: ${{ needs.apply.outputs.run_as }}
      SOVEREIGNSHIELD_INGESTION_CLUSTER: ${{ needs.apply.outputs.cluster }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: databricks/setup-cli@602f285bac0c85e5985bf4c16d5a2befed0578d9 # v1.14.1

      - name: Configure complex bundle variables
        run: python sh/configure_bundle.py --target dev --from-environment

      # Table DDL, the policy UDFs and the row filter / mask bindings are the
      # bundle's, not Terraform's. Applying them here keeps one writer per
      # object: Terraform would otherwise report drift after every run.
      - name: Validate
        run: databricks bundle validate -t dev --var="warehouse_id=${{ needs.apply.outputs.warehouse_id }}"

      - name: Deploy
        run: databricks bundle deploy -t dev --var="warehouse_id=${{ needs.apply.outputs.warehouse_id }}"

      - name: Run the ingestion and validation pipeline
        run: databricks bundle run sovereignshield_sdmx_pipeline -t dev

      - name: Activate the Databricks portal
        run: databricks bundle run sovereignshield_portal -t dev
