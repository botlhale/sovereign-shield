<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Triple-Lock Control Contract</title>
  <desc id="description">Lock 1 row filter decides who may see a row. Lock 2 column masks withhold the value, the counterparty coordinates and lineage hashes of any observation the caller is not entitled to read, preserving segment 9. Lock 3 publication state selects current accepted data and keeps downloads to releasable rows. Entitlement is not statistical disclosure control.</desc>
  <defs>
    <filter id="lift" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.18"/></filter>
  </defs>
  <style>
    text{font-family:Inter,'Segoe UI',Lato,'Liberation Sans',Arial,sans-serif;font-size:19px;fill:#F8FAFC}
    .title{font-size:44px;font-weight:700;fill:#FFFFFF}
    .subtitle{font-size:22px;fill:#7DD3FC}
    .label{font-size:15px;font-weight:700;letter-spacing:1.8px;fill:#E0F2FE}
    .h{font-size:26px;font-weight:700}
    .b{font-size:19px;fill:#E2E8F0}
    .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;font-size:19px}
    .masked{font-style:italic;fill:#94A3B8}
    .dim{fill:#94A3B8}
    .warn{fill:#78350F;font-size:18px}
    .foot{fill:#475569;font-size:16px}
    .rule{stroke:#FFFFFF;stroke-opacity:0.28;stroke-width:1.5}
  </style>
  <rect width="1600" height="900" fill="#F8FAFC"/>
  <rect width="1600" height="124" fill="#1E293B"/>
  <rect y="124" width="534" height="6" fill="#14B8A6"/><rect x="534" y="124" width="533" height="6" fill="#6366F1"/><rect x="1067" y="124" width="533" height="6" fill="#0EA5E9"/>
  <text x="64" y="70" class="title">Triple-Lock Control Contract</text>
  <text x="64" y="106" class="subtitle">Unity Catalog policies travel with the table and resolve per caller, per row, before any predicate.</text>

  <g filter="url(#lift)">
    <rect x="64" y="160" width="448" height="330" rx="18" fill="#0F766E"/>
    <rect x="576" y="160" width="448" height="330" rx="18" fill="#4338CA"/>
    <rect x="1088" y="160" width="448" height="330" rx="18" fill="#0369A1"/>
  </g>
  <text x="92" y="198" class="label">LOCK 1 · ROW FILTER</text>
  <text x="92" y="238" class="h">Who may see the row</text>
  <path d="M92 258 H484" class="rule"/>
  <text x="92" y="296" class="b">Administrator: every country and state</text>
  <text x="92" y="332" class="b">Submitter: own rows plus foreign public</text>
  <text x="92" y="368" class="b">Researcher: published rows</text>
  <text x="92" y="404" class="b">Public: published, explicit F only</text>
  <text x="92" y="440" class="b">No recognized group: zero rows</text>

  <text x="604" y="198" class="label">LOCK 2 · COLUMN MASKS</text>
  <text x="604" y="238" class="h">What a row may reveal</text>
  <path d="M604 258 H996" class="rule"/>
  <text x="604" y="296" class="b">Value: admin, own country or F</text>
  <text x="604" y="332" class="b">Otherwise NULL, never zero</text>
  <text x="604" y="368" class="b">Key segments 10–11 become xx</text>
  <text x="604" y="404" class="b">Record and version hashes: NULL</text>
  <text x="604" y="440" class="b">Segment 9 kept and re-checked</text>

  <text x="1116" y="198" class="label">LOCK 3 · PUBLICATION STATE</text>
  <text x="1116" y="238" class="h">What counts as released</text>
  <path d="M1116 258 H1508" class="rule"/>
  <text x="1116" y="296" class="b">PUBLISHED and IS_CURRENT</text>
  <text x="1116" y="332" class="b">Rejected filings stay audit-only</text>
  <text x="1116" y="368" class="b">Downloads: releasable rows only</text>
  <text x="1116" y="404" class="b">Audit CSV for entitled analysts</text>
  <text x="1116" y="440" class="b">The row filter is not a time gate</text>

  <rect x="64" y="518" width="1472" height="140" rx="18" fill="#1E293B" filter="url(#lift)"/>
  <text x="92" y="556" class="label">DISCOVERY GATEWAY · SAME OBSERVATION, TWO CALLERS</text>
  <text x="92" y="600" class="b">Owner or administrator</text>
  <text x="420" y="600" class="mono">Q.S.C.A.USD.D.5J.A.US.A.5J</text>
  <text x="840" y="600" class="mono">400.000</text>
  <text x="1010" y="600" class="b">N · exact cell</text>
  <text x="92" y="638" class="b">Researcher</text>
  <text x="420" y="638" class="mono">Q.S.C.A.USD.D.5J.A.US<tspan class="masked">.xx.xx</tspan></text>
  <text x="840" y="638" class="mono masked">restricted</text>
  <text x="1010" y="638" class="b">N · existence only, excluded from downloads</text>

  <rect x="64" y="684" width="1472" height="84" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="88" y="718" class="warn" font-weight="700">Entitlement is not disclosure control.</text>
  <text x="88" y="748" class="warn">Masks stop direct reads, filter probes and hash look-ups. Published margins can still isolate a withheld cell; complementary suppression is separate.</text>

  <text x="64" y="830" class="foot">Content-addressed policy functions; normal deployment never detaches protection. Verified bindings: one row filter and five column masks on the history table.</text>
  <text x="64" y="856" class="foot">Independent synthetic reference architecture. No ABAC tags, cryptographic lineage or air gap are implied.</text>
</svg>
