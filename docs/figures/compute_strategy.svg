<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Evaluation Compute and Scale Decisions</title>
  <desc id="description">Ingestion, dissemination warehouse and gateway are sized independently. Ingestion defaults to single node without Photon and driver-bound parsing does not distribute with more workers. Warehouse size and concurrency are separate levers. Pause is not guaranteed zero cost. The synthetic reference cycle of 6 October 2026 took about 42 minutes up with prerequisites already in place, 35 minutes down and US$10 or less in Azure charges.</desc>
  <defs>
    <filter id="lift" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.18"/></filter>
  </defs>
  <style>
    text{font-family:Inter,'Segoe UI',Lato,'Liberation Sans',Arial,sans-serif;font-size:19px;fill:#F8FAFC}
    .title{font-size:44px;font-weight:700;fill:#FFFFFF}
    .subtitle{font-size:22px;fill:#7DD3FC}
    .label{font-size:15px;font-weight:700;letter-spacing:1.8px;fill:#E0F2FE}
    .h{font-size:26px;font-weight:700}
    .b{font-size:19px;fill:#E2E8F0}
    .note{font-size:16px;fill:#CBD5E1;font-style:italic}
    .big{font-size:30px;font-weight:700}
    .foot{fill:#475569;font-size:16px}
    .rule{stroke:#FFFFFF;stroke-opacity:0.28;stroke-width:1.5}
  </style>
  <rect width="1600" height="900" fill="#F8FAFC"/>
  <rect width="1600" height="124" fill="#1E293B"/>
  <rect y="124" width="534" height="6" fill="#475569"/><rect x="534" y="124" width="533" height="6" fill="#6366F1"/><rect x="1067" y="124" width="533" height="6" fill="#0EA5E9"/>
  <text x="64" y="70" class="title">Evaluation Compute and Scale Decisions</text>
  <text x="64" y="106" class="subtitle">Independent sizing levers. Larger compute and Photon need explicit approval and fresh acceptance.</text>

  <g filter="url(#lift)">
    <rect x="64" y="164" width="448" height="340" rx="18" fill="#1E293B"/>
    <rect x="576" y="164" width="448" height="340" rx="18" fill="#4338CA"/>
    <rect x="1088" y="164" width="448" height="340" rx="18" fill="#0369A1"/>
  </g>
  <text x="92" y="202" class="label">INGESTION JOB</text>
  <text x="92" y="242" class="h">Single node by default</text>
  <path d="M92 262 H484" class="rule"/>
  <text x="92" y="300" class="b">Zero workers, no Photon</text>
  <text x="92" y="336" class="b">Governed policy and stable run_as</text>
  <text x="92" y="372" class="b">USER_ISOLATION access mode</text>
  <text x="92" y="408" class="b">Approval flag for larger compute</text>
  <text x="92" y="462" class="note">Driver-bound parsing and validation</text>
  <text x="92" y="484" class="note">do not distribute with more workers.</text>

  <text x="604" y="202" class="label">DISSEMINATION WAREHOUSE</text>
  <text x="604" y="242" class="h">Serverless SQL, sized apart</text>
  <path d="M604 262 H996" class="rule"/>
  <text x="604" y="300" class="b">Size: individual query workload</text>
  <text x="604" y="336" class="b">Clusters: simultaneous readers</text>
  <text x="604" y="372" class="b">Auto-stop and query metrics</text>
  <text x="604" y="408" class="b">Policies resolve on every query</text>
  <text x="604" y="462" class="note">Runtime and access-mode policy support</text>
  <text x="604" y="484" class="note">must be tested on each configuration.</text>

  <text x="1116" y="202" class="label">GATEWAY AND RETENTION</text>
  <text x="1116" y="242" class="h">One evaluation replica</text>
  <path d="M1116 262 H1508" class="rule"/>
  <text x="1116" y="300" class="b">Registry, storage and logs</text>
  <text x="1116" y="336" class="b">Pause: scale-to-zero eligible</text>
  <text x="1116" y="372" class="b">Pause is not guaranteed zero cost</text>
  <text x="1116" y="408" class="b">Ordered, verified teardown</text>
  <text x="1116" y="462" class="note">State backend and account identities</text>
  <text x="1116" y="484" class="note">are retained deliberately.</text>

  <rect x="64" y="540" width="1472" height="134" rx="18" fill="#0F766E" filter="url(#lift)"/>
  <text x="92" y="580" class="label">SYNTHETIC REFERENCE CYCLE · 6 OCTOBER 2026</text>
  <text x="92" y="624" class="big">~42 minutes up · ~35 minutes down · US$10 or less in Azure charges</text>
  <text x="92" y="656" class="b">Prerequisites already in place. Observed evaluation results, not an SLA, price ceiling or throughput benchmark.</text>

  <text x="64" y="738" class="foot">Cost drivers: region, VM and DBU runtime, warehouse size and concurrency, replicas, storage, logs, egress and retained resources.</text>
  <text x="64" y="764" class="foot">Terraform supports alternative-provider adaptations; equivalent identity, policy, storage and history controls require their own tests.</text>
  <text x="64" y="830" class="foot">Independent synthetic reference architecture; no institutional or vendor endorsement.</text>
</svg>
