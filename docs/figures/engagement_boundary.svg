<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">The Contractor Dilemma: Build Without Seeing</title>
  <desc id="description">External providers and AI coding agents work in a synthetic-only sandbox on approved metadata, generated SDMx fixtures and credential-free tests. Reviewed code crosses a production-isolation boundary through client approval gates into client repositories, synthetic staging and production SDMx intake. Confidential records, client credentials and production state never cross. This is production isolation, not an air gap.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 z" fill="#64748B"/></marker>
    <filter id="lift" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.18"/></filter>
  </defs>
  <style>
    text{font-family:Inter,'Segoe UI',Lato,'Liberation Sans',Arial,sans-serif;font-size:19px;fill:#F8FAFC}
    .title{font-size:44px;font-weight:700;fill:#FFFFFF}
    .subtitle{font-size:22px;fill:#7DD3FC}
    .zone{font-size:16px;font-weight:700;letter-spacing:1.6px}
    .indigo{fill:#4338CA}.teal{fill:#0F766E}
    .h{font-size:23px;font-weight:700}
    .b{font-size:18.5px;fill:#E2E8F0}
    .ink{fill:#1E293B}
    .foot{fill:#475569;font-size:16px}
    .flow{stroke:#64748B;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <rect width="1600" height="900" fill="#F8FAFC"/>
  <rect width="1600" height="124" fill="#1E293B"/>
  <rect y="124" width="640" height="6" fill="#6366F1"/><rect x="640" y="124" width="320" height="6" fill="#475569"/><rect x="960" y="124" width="640" height="6" fill="#14B8A6"/>
  <text x="64" y="70" class="title">The Contractor Dilemma: Build Without Seeing</text>
  <text x="64" y="106" class="subtitle">External engineers and AI agents build on synthetic SDMx. Sovereign data stays inside the client boundary.</text>

  <rect x="48" y="150" width="560" height="560" rx="22" fill="#EEF2FF" stroke="#4338CA" stroke-width="2"/>
  <text x="76" y="188" class="zone indigo">PROVIDER AND AI-AGENT SANDBOX</text>
  <text x="76" y="214" class="ink">Synthetic only · no production records or credentials</text>
  <rect x="664" y="150" width="888" height="560" rx="22" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
  <text x="692" y="188" class="zone teal">CLIENT SOVEREIGN BOUNDARY</text>
  <text x="692" y="214" class="ink">Confidential filings, identities, state and every approval decision</text>
  <path d="M636 156 V704" stroke="#1E293B" stroke-width="3" stroke-dasharray="10 8"/>

  <g filter="url(#lift)">
    <rect x="76" y="240" width="504" height="128" rx="16" fill="#4338CA"/>
    <rect x="76" y="396" width="504" height="128" rx="16" fill="#4338CA"/>
    <rect x="76" y="552" width="504" height="128" rx="16" fill="#4338CA"/>
    <rect x="692" y="240" width="380" height="128" rx="16" fill="#1E293B"/>
    <rect x="692" y="396" width="380" height="128" rx="16" fill="#0F766E"/>
    <rect x="692" y="552" width="380" height="128" rx="16" fill="#0F766E"/>
    <rect x="1124" y="240" width="400" height="128" rx="16" fill="#1E293B"/>
    <rect x="1124" y="396" width="400" height="128" rx="16" fill="#0F766E"/>
    <rect x="1124" y="552" width="400" height="128" rx="16" fill="#0F766E"/>
  </g>
  <text x="100" y="282" class="h">Approved information contract</text>
  <text x="100" y="316" class="b">DSD, codelists, rules and persona matrix</text>
  <text x="100" y="344" class="b">No confidential counts or identifiers</text>
  <text x="100" y="438" class="h">Synthetic SDMx fixtures</text>
  <text x="100" y="472" class="b">Official structure, generated values</text>
  <text x="100" y="500" class="b">Every lifecycle and persona branch</text>
  <text x="100" y="594" class="h">Code, policies and tests</text>
  <text x="100" y="628" class="b">Credential-free CI on every pull request</text>
  <text x="100" y="656" class="b">Same SQL policies as production</text>
  <path d="M328 368 V390" class="flow"/><path d="M328 524 V546" class="flow"/>

  <text x="716" y="282" class="h">Independent review</text>
  <text x="716" y="316" class="b">Security and disclosure</text>
  <text x="716" y="344" class="b">Release and residual risk</text>
  <text x="716" y="438" class="h">Client import</text>
  <text x="716" y="472" class="b">Repository, vault, state</text>
  <text x="716" y="500" class="b">Client runtime identities</text>
  <text x="716" y="594" class="h">Synthetic staging</text>
  <text x="716" y="628" class="b">Live personas, replay, recovery</text>
  <text x="716" y="656" class="b">Evidence for the final gate</text>
  <path d="M582 616 H612 V304 H686" class="flow"/>
  <path d="M882 368 V390" class="flow"/><path d="M882 524 V546" class="flow"/>

  <text x="1148" y="282" class="h">Production approval</text>
  <text x="1148" y="316" class="b">Residency, disclosure, recovery</text>
  <text x="1148" y="344" class="b">One gate, no bypass</text>
  <text x="1148" y="438" class="h">Production SDMx intake</text>
  <text x="1148" y="472" class="b">Real filings, unchanged policies</text>
  <text x="1148" y="500" class="b">Analyst reconciliation</text>
  <text x="1148" y="594" class="h">Offboard the provider</text>
  <text x="1148" y="628" class="b">Revoke groups, tokens, RBAC</text>
  <text x="1148" y="656" class="b">Keep runtime identities</text>
  <path d="M1072 616 H1098 V304 H1118" class="flow"/>
  <path d="M1324 368 V390" class="flow"/><path d="M1324 524 V546" class="flow"/>

  <rect x="48" y="734" width="1504" height="76" rx="14" fill="#1E293B"/>
  <text x="76" y="766" font-size="18"><tspan font-weight="700" fill="#5EEAD4">Crosses the boundary:</tspan> reviewed code, tests, runbooks, licences and evidence.</text>
  <text x="76" y="794" font-size="18"><tspan font-weight="700" fill="#FCA5A5">Never crosses:</tspan> confidential observations, client credentials, Terraform state or production exports.</text>

  <text x="48" y="850" class="foot">Production isolation, not an air gap. Repository options, handover package and offboarding follow the Nature of Engagement and Handover playbook.</text>
  <text x="48" y="876" class="foot">Independent synthetic reference architecture; no institutional or vendor endorsement.</text>
</svg>
