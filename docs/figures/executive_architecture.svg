  <text x="88" y="250" class="h">SDMx 3.0 filings</text>
  <text x="88" y="285" class="b">Full country/period snapshot</text>
  <text x="88" y="314" class="b">Immutable submission ID</text>
  <text x="88" y="414" class="h">Validated before history</text>
  <text x="88" y="449" class="b">Pinned BIS LBS 1.0 structure</text>
  <text x="88" y="478" class="b">21 rules: PASS or QUARANTINE</text>
  <text x="88" y="578" class="h">Delta SCD2 history</text>
  <text x="88" y="613" class="b">One MERGE per filing</text>
  <text x="88" y="642" class="b">Rejected filings audit-only</text>
  <path d="M230 342 V366" class="flow"/><path d="M230 506 V530" class="flow"/>

  <text x="468" y="250" class="h">Lock 1 · Row filter</text>
  <text x="468" y="285" class="b">Country · lifecycle · CONF</text>
  <text x="468" y="314" class="b">No group: zero rows</text>
  <text x="468" y="414" class="h">Lock 2 · Column masks</text>
  <text x="468" y="449" class="b">Value withheld: NULL</text>
  <text x="468" y="478" class="b">Key <tspan class="mono">.xx.xx</tspan> · hashes NULL</text>
  <text x="468" y="578" class="h">Lock 3 · Publication</text>
  <text x="468" y="613" class="b">PUBLISHED and IS_CURRENT</text>
  <text x="468" y="642" class="b">Audit products separate</text>

  <text x="848" y="250" class="h">Identity selection</text>
  <text x="848" y="285" class="b">Caller token: SSO, Easy Auth</text>
  <text x="848" y="314" class="b">Anonymous: public principal</text>
  <text x="848" y="414" class="h">Policy on every path</text>
  <text x="848" y="449" class="b">Portal, API, SQL, notebooks</text>
  <text x="848" y="478" class="b">Gateway remains trusted</text>
  <text x="848" y="578" class="h">Standard SDMx products</text>
  <text x="848" y="613" class="b">ML 3.0 · JSON 2.0 · CSV 2.0</text>
  <text x="848" y="642" class="b">Releasable rows only</text>
  <path d="M990 342 V366" class="flow"/><path d="M990 506 V530" class="flow"/>

  <text x="1228" y="248" class="h">Public</text>
  <text x="1228" y="282" class="b">Published, free values</text>
  <text x="1228" y="367" class="h">Researcher · Discovery</text>
  <text x="1228" y="401" class="mono">…5J.A.US<tspan class="masked">.xx.xx</tspan> <tspan class="masked">restricted</tspan></text>
  <text x="1228" y="486" class="h">Submitter · Analyst View</text>
  <text x="1228" y="520" class="b">Own filings, IDs, verdicts</text>
  <text x="1228" y="606" class="h">Administrator</text>
  <text x="1228" y="640" class="b">Full lifecycle audit</text>

  <rect x="64" y="700" width="1472" height="84" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="88" y="734" class="warn" font-weight="700">Entitlement is not disclosure control.</text>
  <text x="88" y="764" class="warn">Published margins can still isolate a withheld cell (synthetic: 1000 − 500 − 400 = 100). Complementary suppression remains a release decision.</text>

  <text x="64" y="840" class="foot">Independent reference architecture · synthetic data · Azure Databricks and Unity Catalog implementation · technology-agnostic pattern</text>
  <text x="64" y="866" class="foot">Not affiliated with or endorsed by any central bank, statistical institution or vendor.</text>
