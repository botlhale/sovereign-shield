<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Sovereign Shield: Governed SDMx Exchange</title>
  <desc id="description">Four planes. Intake perimeter: SDMx filings validated before an atomic Delta history. Governance plane: Unity Catalog row filter, value, coordinate and lineage masks, and publication state. Trusted serving plane: the gateway selects identity and serves releasable SDMx products. Persona outputs: public, researcher Discovery Gateway with coordinate-masked restricted keys, submitter Analyst View and administrator audit. Entitlement is not disclosure control.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 z" fill="#64748B"/></marker>
    <filter id="lift" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.18"/></filter>
  </defs>
  <style>
    text{font-family:Inter,'Segoe UI',Lato,'Liberation Sans',Arial,sans-serif;font-size:19px;fill:#F8FAFC}
    .title{font-size:44px;font-weight:700;fill:#FFFFFF}
    .subtitle{font-size:22px;fill:#7DD3FC}
    .chip{font-size:16px;font-weight:700;letter-spacing:1.6px;fill:#FFFFFF}
    .h{font-size:23px;font-weight:700}
    .b{font-size:18.5px;fill:#E2E8F0}
    .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;font-size:17.5px}
    .masked{font-style:italic;fill:#BAE6FD}
    .warn{fill:#78350F;font-size:18px}
    .foot{fill:#475569;font-size:16px}
    .flow{stroke:#64748B;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <rect width="1600" height="900" fill="#F8FAFC"/>
  <rect width="1600" height="124" fill="#1E293B"/>
  <rect y="124" width="400" height="6" fill="#475569"/><rect x="400" y="124" width="400" height="6" fill="#14B8A6"/>
  <rect x="800" y="124" width="400" height="6" fill="#6366F1"/><rect x="1200" y="124" width="400" height="6" fill="#0EA5E9"/>
  <text x="64" y="70" class="title">Sovereign Shield · Governed SDMx Exchange</text>
  <text x="64" y="106" class="subtitle">Build on synthetic fixtures. Enforce sovereignty in Unity Catalog. Release only what each persona may see.</text>

  <rect x="64" y="152" width="332" height="36" rx="18" fill="#1E293B"/><text x="230" y="176" class="chip" text-anchor="middle">1 · INTAKE PERIMETER</text>
  <rect x="444" y="152" width="332" height="36" rx="18" fill="#0F766E"/><text x="610" y="176" class="chip" text-anchor="middle">2 · GOVERNANCE PLANE</text>
  <rect x="824" y="152" width="332" height="36" rx="18" fill="#4338CA"/><text x="990" y="176" class="chip" text-anchor="middle">3 · TRUSTED SERVING</text>
  <rect x="1204" y="152" width="332" height="36" rx="18" fill="#0369A1"/><text x="1370" y="176" class="chip" text-anchor="middle">4 · PERSONA OUTPUTS</text>
  <path d="M400 170 H436" class="flow"/><path d="M780 170 H816" class="flow"/><path d="M1160 170 H1196" class="flow"/>

  <g filter="url(#lift)">
    <rect x="64" y="208" width="332" height="132" rx="16" fill="#1E293B"/>
    <rect x="64" y="372" width="332" height="132" rx="16" fill="#1E293B"/>
    <rect x="64" y="536" width="332" height="132" rx="16" fill="#1E293B"/>
