    <rect x="444" y="536" width="332" height="132" rx="16" fill="#0F766E"/>
    <rect x="824" y="208" width="332" height="132" rx="16" fill="#4338CA"/>
    <rect x="824" y="372" width="332" height="132" rx="16" fill="#4338CA"/>
    <rect x="824" y="536" width="332" height="132" rx="16" fill="#4338CA"/>
    <rect x="1204" y="208" width="332" height="101" rx="16" fill="#0369A1"/>
    <rect x="1204" y="327" width="332" height="101" rx="16" fill="#0369A1"/>
    <rect x="1204" y="446" width="332" height="101" rx="16" fill="#0369A1"/>
